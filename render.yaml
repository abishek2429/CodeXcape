services:
  - type: web
    name: codexcape-websocket
    runtime: node
    plan: free
    region: singapore
    branch: feature/render-websocket
    autoDeploy: true
    buildCommand: cd backend && npm install --production
    startCommand: cd backend && npm run start:ws
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_WS_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://code-xcape.vercel.app,https://*.vercel.app,http://localhost:5173
      - key: NODE_ENV
        value: production
