spring:
  datasource:
    url: jdbc:h2:mem:technical_escape_room;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

logging:
  level:
    root: INFO
    com.technicalescaperoom.backend: DEBUG
