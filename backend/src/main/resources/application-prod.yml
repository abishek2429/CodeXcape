spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codexcape_prod}
    username: ${SPRING_DATASOURCE_USERNAME:codexcape_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:ChangeMeProdSecretPassword123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

security:
  jwt:
    secret: ${JWT_SECRET_KEY:DefaultProdSuperSecretJwtSigningKey98765432101234567890!}
    expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://codexcape.local}

logging:
  level:
    root: INFO
    com.technicalescaperoom.backend: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
