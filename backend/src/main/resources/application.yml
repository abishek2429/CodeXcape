server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: technical-escape-room-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.cwlccoixkgbbafxujper}
    password: ${SPRING_DATASOURCE_PASSWORD:AbiSiva25mx}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"

app:
  admin:
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://code-xcape.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
